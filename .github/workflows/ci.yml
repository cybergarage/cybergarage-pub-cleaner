name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m venv /tmp/history-cleaner-wheel
          /tmp/history-cleaner-wheel/bin/python -m pip install dist/*.whl
          /tmp/history-cleaner-wheel/bin/git-history-cleaner --version
          /tmp/history-cleaner-wheel/bin/python -m unittest discover -s tests -v
